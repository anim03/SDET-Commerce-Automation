services:
  postgres:
    image: postgres:16
    container_name: sdet-commerce-postgres

    environment:
      POSTGRES_DB: sdetcommerce
      POSTGRES_USER: sdetuser
      POSTGRES_PASSWORD: sdetpassword

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: