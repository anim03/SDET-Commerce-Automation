services:

  postgres:
    image: postgres:16
    container_name: sdet-commerce-postgres

    environment:
      POSTGRES_DB: ${DB_NAME:-sdetcommerce}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME} -d ${DB_NAME:-sdetcommerce}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: sdet-commerce-backend

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-sdetcommerce}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: sdet-commerce-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend


volumes:
  postgres_data:
