name: SDET Commerce CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sdetcommerce
          POSTGRES_USER: sdetuser
          POSTGRES_PASSWORD: sdetpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sdetuser -d sdetcommerce"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/sdetcommerce
      DB_USERNAME: sdetuser
      DB_PASSWORD: sdetpassword
      JWT_SECRET: 012345678901234567890123456789012345678901234567890123456789abcd
      JWT_EXPIRATION_MS: 3600000

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven Wrapper Executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Run Backend Tests
        working-directory: backend
        run: ./mvnw clean test


  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Build Frontend
        working-directory: frontend
        run: npm run build


  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest

    env:
      DB_NAME: sdetcommerce
      DB_USERNAME: sdetuser
      DB_PASSWORD: sdetpassword
      JWT_SECRET: 012345678901234567890123456789012345678901234567890123456789abcd
      JWT_EXPIRATION_MS: 3600000

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build Docker Images
        run: docker compose build


  api-automation:
    name: REST Assured API Automation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sdetcommerce
          POSTGRES_USER: sdetuser
          POSTGRES_PASSWORD: sdetpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sdetuser -d sdetcommerce"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_ENV: local
      BASE_URL: http://localhost:8080

      TEST_EMAIL: ci-user@sdetcommerce.test
      TEST_PASSWORD: CiUser@123

      ADMIN_EMAIL: ci-admin@sdetcommerce.test
      ADMIN_PASSWORD: CiAdmin@123

      DB_URL: jdbc:postgresql://localhost:5432/sdetcommerce
      DB_USERNAME: sdetuser
      DB_PASSWORD: sdetpassword

      JWT_SECRET: 012345678901234567890123456789012345678901234567890123456789abcd
      JWT_EXPIRATION_MS: 3600000

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven Wrapper Executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Start Backend
        working-directory: backend
        run: |
          ./mvnw spring-boot:run \
            > ../backend-ci.log 2>&1 &
          echo $! > ../backend-ci.pid

      - name: Wait for Backend
        run: |
          echo "Waiting for Spring Boot..."

          for i in {1..60}; do
            STATUS=$(curl \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              http://localhost:8080/v3/api-docs || true)

            if [ "$STATUS" = "200" ]; then
              echo "Backend is ready."
              exit 0
            fi

            echo "Attempt $i/60 - HTTP $STATUS"
            sleep 2
          done

          echo "Backend failed to become ready."
          cat backend-ci.log
          exit 1

      - name: Register CI User
        run: |
          STATUS=$(curl \
            --silent \
            --output register-user-response.json \
            --write-out "%{http_code}" \
            --request POST \
            http://localhost:8080/api/users/register \
            --header "Content-Type: application/json" \
            --data '{
              "name": "CI Test User",
              "email": "ci-user@sdetcommerce.test",
              "password": "CiUser@123"
            }')

          echo "User registration HTTP status: $STATUS"

          if [ "$STATUS" != "201" ]; then
            cat register-user-response.json
            exit 1
          fi

      - name: Register CI Admin User
        run: |
          STATUS=$(curl \
            --silent \
            --output register-admin-response.json \
            --write-out "%{http_code}" \
            --request POST \
            http://localhost:8080/api/users/register \
            --header "Content-Type: application/json" \
            --data '{
              "name": "CI Admin User",
              "email": "ci-admin@sdetcommerce.test",
              "password": "CiAdmin@123"
            }')

          echo "Admin registration HTTP status: $STATUS"

          if [ "$STATUS" != "201" ]; then
            cat register-admin-response.json
            exit 1
          fi

      - name: Promote CI User to Admin
        env:
          PGPASSWORD: sdetpassword
        run: |
          psql \
            -h localhost \
            -U sdetuser \
            -d sdetcommerce \
            -v ON_ERROR_STOP=1 \
            -c "UPDATE users
                SET role = 'ROLE_ADMIN'
                WHERE email = 'ci-admin@sdetcommerce.test';"

          ADMIN_COUNT=$(psql \
            -h localhost \
            -U sdetuser \
            -d sdetcommerce \
            -tAc "SELECT COUNT(*)
                  FROM users
                  WHERE email = 'ci-admin@sdetcommerce.test'
                  AND role = 'ROLE_ADMIN';")

          if [ "$ADMIN_COUNT" != "1" ]; then
            echo "Admin promotion verification failed."
            exit 1
          fi

          echo "CI admin role verified."

      - name: Run REST Assured Test Suite
        working-directory: api-automation
        run: mvn clean test

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-allure-results
          path: api-automation/target/allure-results
          if-no-files-found: warn

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-surefire-reports
          path: api-automation/target/surefire-reports
          if-no-files-found: warn

      - name: Upload Backend Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-backend-log
          path: backend-ci.log
          if-no-files-found: ignore
