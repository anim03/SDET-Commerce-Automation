name: SDET Commerce CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: sdetcommerce
          POSTGRES_USER: sdetuser
          POSTGRES_PASSWORD: sdetpassword

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U sdetuser -d sdetcommerce"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/sdetcommerce
      DB_USERNAME: sdetuser
      DB_PASSWORD: sdetpassword
      JWT_SECRET: 012345678901234567890123456789012345678901234567890123456789abcd
      JWT_EXPIRATION_MS: 3600000

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven Wrapper Executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Run Backend Tests
        working-directory: backend
        run: ./mvnw clean test


  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Build Frontend
        working-directory: frontend
        run: npm run build


  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest

    env:
      DB_NAME: sdetcommerce
      DB_USERNAME: sdetuser
      DB_PASSWORD: sdetpassword
      JWT_SECRET: 012345678901234567890123456789012345678901234567890123456789abcd
      JWT_EXPIRATION_MS: 3600000

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build Docker Images
        run: docker compose build
